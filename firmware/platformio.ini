; SLR Remote firmware. One image, two roles (handheld / camera board).
[platformio]
default_envs = heltec_v4

[env:heltec_v4]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=2
  -DXE5_FW_VERSION=\"0.4.0\"
build_unflags = -std=gnu++11
; Exact versions (the ones tested), so a clean build cannot pick up a newer release.
lib_deps =
  h2zero/NimBLE-Arduino@2.5.2
  jgromes/RadioLib@7.8.1
  olikraus/U8g2@2.36.18
  mikalhart/TinyGPSPlus@1.1.0
test_ignore = *

; Host-side unit tests for the pure logic in lib/core (no hardware).
; Run: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -DXE5_NATIVE -Wall
build_src_filter = -<*>
